<!-- ── Sticky + Burger JS (self-contained, runs after module inject) ── -->
<script>
(function () {
  'use strict';

  /* ── Sticky on scroll ── */
  var header = document.getElementById('simpleHeader');
  if (header) {
    window.addEventListener('scroll', function () {
      header.classList.toggle('is-sticky', window.scrollY > 60);
    }, { passive: true });
  }

  /* ── Mobile burger drawer ── */
  var burger   = document.getElementById('sh-burger-btn');
  var drawer   = document.getElementById('sh-mobile-drawer');
  var overlay  = document.getElementById('sh-mobile-overlay');
  var closeBtn = document.getElementById('sh-drawer-close');

  function openDrawer()  {
    if (drawer)  drawer.classList.add('open');
    if (overlay) overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    if (drawer)  drawer.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  if (burger)   burger.addEventListener('click', openDrawer);
  if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
  if (overlay)  overlay.addEventListener('click', closeDrawer);

  /* ── Sync cart counts ── */
  function syncCartCount() {
    var existing = document.querySelector('.tft-top-bar__cart-count, .fur-header-cart__count');
    var badges   = document.querySelectorAll('.sh-cart-count');
    if (existing) {
      badges.forEach(function(b){ b.textContent = existing.textContent || '0'; });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncCartCount);
  } else {
    syncCartCount();
  }
})();
</script>
